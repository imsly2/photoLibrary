<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <h1>Library</h1>
    <input type="search" id="search" placeholder="Search" aria-label="Search" autocomplete="off">
    <div id="search-chips" role="group" aria-label="Search">
      <button type="button" id="chip-people" data-scope="people" aria-pressed="false">People</button>
      <button type="button" id="chip-places" data-scope="places" aria-pressed="false">Places</button>
      <button type="button" id="chip-things" data-scope="things" aria-pressed="false">Things</button>
    </div>
    <div class="toolbar">
      <label class="toolbar-field">Sort
        <select id="sort" aria-label="Sort">
          <option value="date">Date</option>
          <option value="location">Location</option>
          <option value="name">Name</option>
        </select>
      </label>
      <label class="toolbar-field">Direction
        <select id="dir" aria-label="Direction">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </label>
    </div>
    <button type="button" id="add-folder-btn">Add folder</button>
  </header>
  <p id="scan-status" class="status" hidden></p>
  <div class="workspace">
    <main id="grid">
      <p>No pictures yet</p>
    </main>
    <aside id="inspector" hidden>
      <p id="inspector-name"></p>
      <p id="inspector-count"></p>
      <ul id="inspector-filenames"></ul>
    </aside>
    <aside class="levels" aria-label="Zoom level">
      <label class="level-slider-label" for="zoom-slider">Zoom</label>
      <input type="range" id="zoom-slider" min="0" max="3" step="1" value="0" aria-label="Zoom level">
      <div class="level-labels" aria-hidden="true">
        <span>Years</span>
        <span>Months</span>
        <span>Days</span>
        <span>All</span>
      </div>
    </aside>
  </div>
  <dialog id="add-folder" aria-labelledby="add-folder-title">
    <h2 id="add-folder-title">Add a folder</h2>
    <label class="path-field">Path
      <input type="text" id="add-path" autocomplete="off" spellcheck="false">
    </label>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="add-mode" value="copy-here">
        <span>
          <strong>Copy onto this drive</strong>
          <em>Originals travel with this drive.</em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="add-mode" value="serve-from-there">
        <span>
          <strong>Serve from that folder</strong>
          <em>Originals stay where they are.</em>
        </span>
      </label>
    </div>
    <p id="add-error" class="dialog-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="add-cancel">Cancel</button>
      <button type="button" id="add-submit" disabled>Add</button>
    </div>
  </dialog>
  <div id="viewer" hidden>
    <div id="viewer-bar">
      <button type="button" id="viewer-back">Library</button>
    </div>
    <p id="unavailable-banner" hidden>Original is not on this computer</p>
    <div id="viewer-stage">
      <img id="viewer-image" alt="">
      <img id="viewer-original" alt="" hidden>
      <video id="viewer-video" hidden playsinline></video>
      <p id="viewer-placeholder" hidden>Preview is not available</p>
    </div>
    <div id="viewer-labels">
      <div id="viewer-place" class="label-row"></div>
      <div id="viewer-people" class="label-row"></div>
      <div id="viewer-things" class="label-row"></div>
      <div id="viewer-fields">
        <input type="text" id="person-field" aria-label="Person" autocomplete="off" spellcheck="false">
        <input type="text" id="place-field" aria-label="Place" autocomplete="off" spellcheck="false">
        <input type="text" id="thing-field" aria-label="Thing" autocomplete="off" spellcheck="false">
      </div>
      <p id="annotate-error" hidden></p>
    </div>
    <div id="viewer-actions">
      <button type="button" id="open-original">Open original</button>
      <button type="button" id="play-preview" disabled>Play preview</button>
    </div>
  </div>
  <script src="/assets/library.js"></script>
</body>
</html>
