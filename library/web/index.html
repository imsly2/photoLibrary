<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <nav class="views" aria-label="Views">
      <button type="button" id="view-library" class="view-heading" aria-pressed="true">Library</button>
      <button type="button" id="view-globe" aria-pressed="false">Globe</button>
    </nav>
    <input type="search" id="search" placeholder="Search" aria-label="Search" autocomplete="off">
    <div id="search-chips" role="group" aria-label="Search">
      <button type="button" id="chip-people" data-scope="people" aria-pressed="false">People</button>
      <button type="button" id="chip-places" data-scope="places" aria-pressed="false">Places</button>
      <button type="button" id="chip-things" data-scope="things" aria-pressed="false">Things</button>
    </div>
    <div class="toolbar">
      <label class="toolbar-field">Sort
        <select id="sort" aria-label="Sort">
          <option value="date">Date</option>
          <option value="location">Location</option>
          <option value="name">Name</option>
        </select>
      </label>
      <label class="toolbar-field">Direction
        <select id="dir" aria-label="Direction">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </label>
      <button type="button" id="filter-videos" class="toolbar-toggle" aria-pressed="false">Videos</button>
      <button type="button" id="group-dates" class="toolbar-toggle" aria-pressed="true">Dates</button>
    </div>
    <button type="button" id="add-folder-btn">Add folder</button>
    <button type="button" id="update-library">Update Library</button>
  </header>
  <p id="disconnected-banner" hidden>Library is not responding</p>
  <p id="update-status" class="status" hidden></p>
  <p id="scan-status" class="status" hidden></p>
  <div class="workspace">
    <main id="grid">
      <p>No pictures yet</p>
    </main>
    <aside id="inspector" hidden>
      <p id="inspector-name"></p>
      <p id="inspector-count"></p>
      <ul id="inspector-filenames"></ul>
    </aside>
    <aside class="levels" aria-label="Zoom level">
      <label class="level-slider-label" for="zoom-slider">Zoom</label>
      <input type="range" id="zoom-slider" min="0" max="3" step="1" value="0" aria-label="Zoom level">
      <div class="level-labels" aria-hidden="true">
        <span>Years</span>
        <span>Months</span>
        <span>Days</span>
        <span>All</span>
      </div>
      <label class="level-slider-label" for="size-slider">Size</label>
      <input type="range" id="size-slider" min="0" max="7" step="1" value="0" aria-label="Thumbnail size">
    </aside>
  </div>
  <div id="globe-view" hidden>
    <canvas id="globe-canvas"></canvas>
    <div id="globe-pins"></div>
    <button type="button" id="globe-play">Play</button>
    <div id="globe-tour-media" hidden>
      <img id="globe-tour-image" alt="" hidden>
      <video id="globe-tour-video" hidden muted playsinline></video>
    </div>
    <p id="globe-empty" hidden>No locations to show</p>
    <p id="globe-error" hidden></p>
  </div>
  <dialog id="add-folder" aria-labelledby="add-folder-title">
    <h2 id="add-folder-title">Add a folder</h2>
    <label class="path-field">Path
      <span class="path-row">
        <input type="text" id="add-path" autocomplete="off" spellcheck="false">
        <button type="button" id="add-browse">Browse</button>
      </span>
    </label>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="add-mode" value="copy-here">
        <span>
          <strong>Copy onto this drive</strong>
          <em>Originals travel with this drive.</em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="add-mode" value="serve-from-there">
        <span>
          <strong>Serve from that folder</strong>
          <em>Originals stay where they are.</em>
        </span>
      </label>
    </div>
    <p id="add-error" class="dialog-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="add-cancel">Cancel</button>
      <button type="button" id="add-submit" disabled>Add</button>
    </div>
  </dialog>
  <div id="viewer" hidden>
    <div id="viewer-bar">
      <button type="button" id="viewer-back">Back</button>
      <p id="viewer-crumb"></p>
      <div id="viewer-tools">
        <button type="button" id="viewer-favorite" aria-pressed="false" aria-label="Favorite">♡</button>
        <button type="button" id="viewer-slideshow" aria-pressed="false" title="Slideshow F5">Slideshow</button>
        <button type="button" id="viewer-fullscreen" aria-pressed="false" title="Fullscreen F11">Fullscreen</button>
        <div id="viewer-info-wrap">
          <button type="button" id="viewer-info" aria-expanded="false" aria-controls="viewer-info-panel">Info</button>
          <div id="viewer-info-panel" hidden>
            <div id="viewer-facts"></div>
            <p class="info-heading">People</p>
            <div id="viewer-people" class="label-row"></div>
            <p class="info-heading">Places</p>
            <div id="viewer-place" class="label-row"></div>
            <p class="info-heading">Things</p>
            <div id="viewer-things" class="label-row"></div>
            <div id="viewer-fields">
              <label class="annotate-field">Person
                <input type="text" id="person-field" placeholder="Person" aria-label="Person" autocomplete="off" spellcheck="false">
              </label>
              <label class="annotate-field">Place
                <input type="text" id="place-field" placeholder="Place" aria-label="Place" autocomplete="off" spellcheck="false">
              </label>
              <label class="annotate-field">Thing
                <input type="text" id="thing-field" placeholder="Thing" aria-label="Thing" autocomplete="off" spellcheck="false">
              </label>
            </div>
            <p id="annotate-error" hidden></p>
          </div>
        </div>
      </div>
    </div>
    <p id="unavailable-banner" hidden>Original is not on this computer</p>
    <div id="viewer-stage">
      <img id="viewer-image" alt="">
      <img id="viewer-original" alt="" hidden>
      <video id="viewer-video" hidden playsinline></video>
      <p id="viewer-placeholder" hidden>Preview is not available</p>
    </div>
    <div id="viewer-bottom">
      <div id="viewer-nav">
        <button type="button" id="viewer-prev" title="Previous ←">Previous</button>
        <button type="button" id="viewer-rotate" title="Rotate Ctrl+R">Rotate</button>
        <button type="button" id="viewer-next" title="Next →">Next</button>
      </div>
      <label class="viewer-zoom-field" title="Zoom Ctrl++ / Ctrl+− · Ctrl+0 fit · Ctrl+1 100%">Zoom
        <input type="range" id="viewer-zoom-slider" min="25" max="1600" value="100" aria-label="Viewer zoom">
      </label>
      <div id="viewer-actions">
        <button type="button" id="reveal-original">Reveal in Explorer</button>
        <button type="button" id="open-original">Open</button>
        <button type="button" id="play-preview" disabled>Play preview</button>
      </div>
    </div>
  </div>
  <p id="slideshow-empty" hidden>Add photos first</p>
  <script src="/assets/library.js"></script>
  <script src="/assets/globe.js"></script>
</body>
</html>
